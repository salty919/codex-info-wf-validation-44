name: CodeQL analysis (advanced)

on:
  workflow_call:
    inputs:
      source_sha:
        description: Immutable source commit selected by the trusted caller
        required: true
        type: string
      head_ref:
        description: Source branch used for CodeQL result attribution
        required: true
        type: string
      languages_json:
        description: Exact non-empty JSON language array selected by the trusted caller
        required: false
        default: '["actions","csharp","python","rust"]'
        type: string
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.languages_json || '["actions","csharp","python","rust"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          ref: ${{ inputs.source_sha && format('refs/heads/{0}', inputs.head_ref) || github.ref }}
          sha: ${{ inputs.source_sha || github.sha }}
