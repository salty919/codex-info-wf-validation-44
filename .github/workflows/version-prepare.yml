name: Prepare PR version

# This workflow is deliberately target-based: GitHub evaluates it from the
# base/default branch.  It never checks out, interprets, or executes PR code.
on:
  pull_request_target:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: version-prepare-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: refs/heads/main
          fetch-depth: 1
          persist-credentials: false

      - name: Validate and prepare version data
        id: prepare
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          [[ "$REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || {
            echo 'repository name is not a safe GitHub owner/name value' >&2
            exit 1
          }
          [[ "$BASE_REPOSITORY" == "$REPOSITORY" ]] || {
            echo 'PR base repository does not match the target repository' >&2
            exit 1
          }
          [[ "$BASE_SHA" =~ ^[0-9a-fA-F]{40}$ && "$HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo 'PR base/head must be full commit SHAs' >&2
            exit 1
          }
          [[ "$HEAD_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || {
            echo 'PR head repository is not a safe GitHub owner/name value' >&2
            exit 1
          }
          [[ "$HEAD_REF" != /* && "$HEAD_REF" != *'..'* && "$HEAD_REF" != *'?'* && "$HEAD_REF" != *'#'* ]] || {
            echo 'PR head ref is not a safe branch ref for the Git Data API' >&2
            exit 1
          }

          work="$RUNNER_TEMP/version-prepare"
          base="$work/base"
          head="$work/head"
          next="$work/next"
          mkdir -p "$base/windows-client" "$head/windows-client" "$next/windows-client"

          fetch_version_file() {
            local repository="$1"
            local ref="$2"
            local path="$3"
            local output="$4"
            local response encoding file_type content
            response="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/$repository/contents/$path?ref=$ref")"
            file_type="$(jq -r '.type // empty' <<<"$response")"
            encoding="$(jq -r '.encoding // empty' <<<"$response")"
            [[ "$file_type" == file && "$encoding" == base64 ]] || {
              echo "Contents API did not return base64 file data for $repository:$path@$ref" >&2
              return 1
            }
            content="$(jq -r '.content // empty' <<<"$response")"
            [[ -n "$content" ]] || {
              echo "Contents API returned empty data for $repository:$path@$ref" >&2
              return 1
            }
            printf '%s' "$content" | tr -d '\r\n' | base64 --decode > "$output"
            [[ -s "$output" ]] || {
              echo "decoded version file is empty: $output" >&2
              return 1
            }
          }

          fetch_version_file "$REPOSITORY" "$BASE_SHA" Cargo.toml "$base/Cargo.toml"
          fetch_version_file "$REPOSITORY" "$BASE_SHA" Cargo.lock "$base/Cargo.lock"
          fetch_version_file "$REPOSITORY" "$BASE_SHA" windows-client/Directory.Build.props "$base/windows-client/Directory.Build.props"
          fetch_version_file "$HEAD_REPOSITORY" "$HEAD_SHA" Cargo.toml "$head/Cargo.toml"
          fetch_version_file "$HEAD_REPOSITORY" "$HEAD_SHA" Cargo.lock "$head/Cargo.lock"
          fetch_version_file "$HEAD_REPOSITORY" "$HEAD_SHA" windows-client/Directory.Build.props "$head/windows-client/Directory.Build.props"

          base_version="$(python3 scripts/product_version.py check \
            --cargo-toml "$base/Cargo.toml" \
            --cargo-lock "$base/Cargo.lock" \
            --windows-props "$base/windows-client/Directory.Build.props" |
            sed -n 's/^version=//p')"
          head_version="$(python3 scripts/product_version.py check \
            --cargo-toml "$head/Cargo.toml" \
            --cargo-lock "$head/Cargo.lock" \
            --windows-props "$head/windows-client/Directory.Build.props" |
            sed -n 's/^version=//p')"
          next_version="$(python3 scripts/product_version.py next --version "$base_version" |
            sed -n 's/^version=//p')"
          [[ -n "$base_version" && -n "$head_version" && -n "$next_version" ]] || {
            echo 'version authority returned an incomplete result' >&2
            exit 1
          }

          if [[ "$head_version" == "$next_version" ]]; then
            printf 'check_conclusion=success\nversion=%s\n' "$head_version" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          [[ "$head_version" == "$base_version" ]] || {
            echo "PR version must be base $base_version or exact next patch $next_version; found $head_version" >&2
            exit 1
          }
          if [[ "$HEAD_REPOSITORY" != "$REPOSITORY" ]]; then
            echo 'automatic version preparation requires a same-repository PR' >&2
            exit 1
          fi

          # `bump` runs only against temporary files decoded from the API. It
          # never writes the trusted checkout or a PR checkout; the eventual
          # repository mutation is the single Git Data API ref update below.
          cp "$head/Cargo.toml" "$next/Cargo.toml"
          cp "$head/Cargo.lock" "$next/Cargo.lock"
          cp "$head/windows-client/Directory.Build.props" "$next/windows-client/Directory.Build.props"
          python3 scripts/product_version.py bump --expected "$base_version" \
            --cargo-toml "$next/Cargo.toml" \
            --cargo-lock "$next/Cargo.lock" \
            --windows-props "$next/windows-client/Directory.Build.props"
          prepared_version="$(python3 scripts/product_version.py check \
            --cargo-toml "$next/Cargo.toml" \
            --cargo-lock "$next/Cargo.lock" \
            --windows-props "$next/windows-client/Directory.Build.props" |
            sed -n 's/^version=//p')"
          [[ "$prepared_version" == "$next_version" ]] || {
            echo "version authority prepared an unexpected version: $prepared_version" >&2
            exit 1
          }

          # Verify the branch still names the event head before creating any
          # objects, then rely on force=false for the final non-fast-forward
          # race boundary if it moves while these objects are being created.
          get_ref_endpoint="repos/$REPOSITORY/git/ref/heads/$HEAD_REF"
          update_ref_endpoint="repos/$REPOSITORY/git/refs/heads/$HEAD_REF"
          observed_head="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$get_ref_endpoint" --jq '.object.sha')"
          [[ "$observed_head" == "$HEAD_SHA" ]] || {
            echo "PR head moved before version preparation: expected $HEAD_SHA, found $observed_head" >&2
            exit 1
          }
          head_tree_sha="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$REPOSITORY/git/commits/$HEAD_SHA" --jq '.tree.sha')"
          [[ "$head_tree_sha" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo 'Git Commit API did not return the PR head tree' >&2
            exit 1
          }

          create_blob() {
            local path="$1"
            local encoded
            encoded="$(base64 --wrap=0 "$path")"
            gh api \
              --method POST \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/$REPOSITORY/git/blobs" \
              -f "content=$encoded" \
              -f encoding=base64 \
              --jq '.sha'
          }
          cargo_toml_blob="$(create_blob "$next/Cargo.toml")"
          cargo_lock_blob="$(create_blob "$next/Cargo.lock")"
          windows_props_blob="$(create_blob "$next/windows-client/Directory.Build.props")"
          [[ "$cargo_toml_blob" =~ ^[0-9a-fA-F]{40}$ &&
              "$cargo_lock_blob" =~ ^[0-9a-fA-F]{40}$ &&
              "$windows_props_blob" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo 'Git Blob API returned an invalid object id' >&2
            exit 1
          }

          tree_payload="$(jq -n \
            --arg base "$head_tree_sha" \
            --arg cargo_toml_sha "$cargo_toml_blob" \
            --arg cargo_lock_sha "$cargo_lock_blob" \
            --arg windows_props_sha "$windows_props_blob" \
            '{base_tree:$base,tree:[
              {path:"Cargo.toml",mode:"100644",type:"blob",sha:$cargo_toml_sha},
              {path:"Cargo.lock",mode:"100644",type:"blob",sha:$cargo_lock_sha},
              {path:"windows-client/Directory.Build.props",mode:"100644",type:"blob",sha:$windows_props_sha}
            ]}')"
          tree_sha="$(gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$REPOSITORY/git/trees" \
            --input - --jq '.sha' <<<"$tree_payload")"
          [[ "$tree_sha" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo 'Git Tree API returned an invalid object id' >&2
            exit 1
          }

          commit_payload="$(jq -n \
            --arg message "chore: prepare version $next_version" \
            --arg tree "$tree_sha" \
            --arg parent "$HEAD_SHA" \
            '{message:$message,tree:$tree,parents:[$parent]}')"
          commit_sha="$(gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$REPOSITORY/git/commits" \
            --input - --jq '.sha' <<<"$commit_payload")"
          [[ "$commit_sha" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo 'Git Commit API returned an invalid object id' >&2
            exit 1
          }
          commit_info="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$REPOSITORY/git/commits/$commit_sha")"
          [[ "$(jq -r '.tree.sha' <<<"$commit_info")" == "$tree_sha" &&
              "$(jq -r '.parents | length' <<<"$commit_info")" == 1 &&
              "$(jq -r '.parents[0].sha' <<<"$commit_info")" == "$HEAD_SHA" ]] || {
            echo 'Git Commit API parent/tree proof did not match the PR head' >&2
            exit 1
          }

          gh api \
            --method PATCH \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$update_ref_endpoint" \
            -f "sha=$commit_sha" \
            -F force=false \
            --jq '.object.sha' | grep -Fx "$commit_sha"
