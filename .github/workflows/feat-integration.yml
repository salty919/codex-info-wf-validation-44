name: Feat integration

on:
  pull_request_target:
    branches: ["feat/next"]
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: feat-integration-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  register-selection:
    name: Register trusted selective gate
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      pull-requests: read
    outputs:
      base_sha: ${{ steps.classify.outputs.base_sha }}
      head_ref: ${{ steps.classify.outputs.head_ref }}
      head_sha: ${{ steps.classify.outputs.head_sha }}
      selection_json: ${{ steps.classify.outputs.selection_json }}
      codeql_languages_json: ${{ steps.classify.outputs.codeql_languages_json }}
      check_id: ${{ steps.register.outputs.check_id }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: refs/heads/main
          fetch-depth: 1
          persist-credentials: false
      - name: Read, classify, and reread the exact pull request
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ &&
              "$EVENT_BASE_REPOSITORY" == "$REPOSITORY" &&
              "$EVENT_HEAD_REPOSITORY" == "$REPOSITORY" &&
              "$EVENT_BASE_REF" == feat/next &&
              "$EVENT_HEAD_REF" != feat/next &&
              "$EVENT_HEAD_REF" != main &&
              "$PR_NUMBER" =~ ^[1-9][0-9]*$ &&
              "$EVENT_BASE_SHA" =~ ^[0-9a-fA-F]{40}$ &&
              "$EVENT_HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo 'feat integration event identity is malformed or outside the repository boundary' >&2
            exit 1
          }
          scope_root="$RUNNER_TEMP/feat-integration-scope"
          mkdir -p "$scope_root"
          gh api --method GET "repos/$REPOSITORY/pulls/$PR_NUMBER" > "$scope_root/before.json"
          gh api --method GET --paginate --slurp \
            "repos/$REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" > "$scope_root/files.json"
          gh api --method GET "repos/$REPOSITORY/pulls/$PR_NUMBER" > "$scope_root/after.json"
          classify() {
            python3 scripts/ci_change_scope.py \
              --pull-request "$1" \
              --files "$scope_root/files.json" \
              --expected-repository "$REPOSITORY" \
              --expected-head-repository "$EVENT_HEAD_REPOSITORY" \
              --expected-head-ref "$EVENT_HEAD_REF" \
              --expected-number "$PR_NUMBER" \
              --expected-base-ref feat/next \
              --expected-base-sha "$EVENT_BASE_SHA" \
              --expected-head-sha "$EVENT_HEAD_SHA" \
              --expected-state open \
              --format json
          }
          before_selection="$(classify "$scope_root/before.json")"
          after_selection="$(classify "$scope_root/after.json")"
          [[ "$before_selection" == "$after_selection" ]] || {
            echo 'pull request selection changed while files were being read' >&2
            exit 1
          }
          jq -e '
            (.owners | type == "array" and length > 0) and
            (.codeql_languages | type == "array") and
            (.binary_impact | type == "boolean")
          ' <<<"$after_selection" >/dev/null
          printf 'base_sha=%s\nhead_ref=%s\nhead_sha=%s\nselection_json=%s\ncodeql_languages_json=%s\n' \
            "$EVENT_BASE_SHA" "$EVENT_HEAD_REF" "$EVENT_HEAD_SHA" "$after_selection" \
            "$(jq -c '.codeql_languages' <<<"$after_selection")" >> "$GITHUB_OUTPUT"
      - name: Register the one required check on the immutable head
        id: register
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ steps.classify.outputs.base_sha }}
          HEAD_REF: ${{ steps.classify.outputs.head_ref }}
          HEAD_SHA: ${{ steps.classify.outputs.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/feat_integration_check_reporter.py register \
            --repository "$REPOSITORY" \
            --pr-number "$PR_NUMBER" \
            --base-sha "$BASE_SHA" \
            --head-ref "$HEAD_REF" \
            --head-sha "$HEAD_SHA" \
            --run-url "$RUN_URL" \
            --github-output "$GITHUB_OUTPUT"

  selective-quality:
    name: Run selected quality owners
    needs: [register-selection]
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    uses: ./.github/workflows/selective-quality.yml
    with:
      source_sha: ${{ needs.register-selection.outputs.head_sha }}
      base_sha: ${{ needs.register-selection.outputs.base_sha }}
      head_ref: ${{ needs.register-selection.outputs.head_ref }}
      pr_number: ${{ github.event.pull_request.number }}
      selection_json: ${{ needs.register-selection.outputs.selection_json }}
      codeql_languages_json: ${{ needs.register-selection.outputs.codeql_languages_json }}

  finalize-selection:
    name: Finalize trusted selective gate
    if: always() && needs.register-selection.result == 'success'
    needs: [register-selection, selective-quality]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: write
      contents: read
      pull-requests: read
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: refs/heads/main
          fetch-depth: 1
          persist-credentials: false
      - name: Finalize only the registered check for the still-current head
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ needs.register-selection.outputs.base_sha }}
          HEAD_REF: ${{ needs.register-selection.outputs.head_ref }}
          HEAD_SHA: ${{ needs.register-selection.outputs.head_sha }}
          CHECK_ID: ${{ needs.register-selection.outputs.check_id }}
          QUALITY_RESULT: ${{ needs.selective-quality.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/feat_integration_check_reporter.py finalize \
            --repository "$REPOSITORY" \
            --pr-number "$PR_NUMBER" \
            --base-sha "$BASE_SHA" \
            --head-ref "$HEAD_REF" \
            --head-sha "$HEAD_SHA" \
            --run-url "$RUN_URL" \
            --check-id "$CHECK_ID" \
            --quality-result "$QUALITY_RESULT"
