name: Windows client

on:
  workflow_call:
    inputs:
      premerge:
        description: Run the immutable pre-merge quality graph
        required: true
        type: boolean
      pr_number:
        description: Exact pull request number selected by the trusted caller
        required: true
        type: string
      base_repository:
        description: Exact pull request base repository
        required: true
        type: string
      head_repository:
        description: Exact pull request head repository
        required: true
        type: string
      base_sha:
        description: Exact pull request base SHA
        required: true
        type: string
      head_sha:
        description: Exact prepared pull request head SHA
        required: true
        type: string
      head_ref:
        description: Exact pull request head branch
        required: true
        type: string
    outputs:
      binary_impact:
        value: ${{ jobs.version-prepared.outputs.binary_impact }}
      version:
        value: ${{ jobs.version-prepared.outputs.version }}
      verdict_artifact_id:
        value: ${{ jobs.acceptance.outputs.verdict_artifact_id }}
      verdict_artifact_digest:
        value: ${{ jobs.acceptance.outputs.verdict_artifact_digest }}
      candidate_artifact_id:
        value: ${{ jobs.acceptance.outputs.candidate_artifact_id }}
      candidate_artifact_digest:
        value: ${{ jobs.acceptance.outputs.candidate_artifact_digest }}
  pull_request_target:
    branches: ["main"]
    types: [closed]

permissions:
  contents: read

concurrency:
  group: windows-client-${{ inputs.premerge && inputs.pr_number || 'release-main' }}
  cancel-in-progress: false

jobs:
  version-prepared:
    if: inputs.premerge == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      binary_impact: ${{ steps.scope.outputs.binary_impact }}
      ready: ${{ steps.version.outputs.ready }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.head_sha }}
          persist-credentials: false
      - name: Classify pull request scope from the trusted base
        id: scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          BASE_REPOSITORY: ${{ inputs.base_repository }}
          HEAD_REPOSITORY: ${{ inputs.head_repository }}
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
          HEAD_REF: ${{ inputs.head_ref }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$HEAD_SHA" &&
              "$REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ &&
              "$BASE_REPOSITORY" == "$REPOSITORY" &&
              "$HEAD_REPOSITORY" == "$REPOSITORY" &&
              "$PR_NUMBER" =~ ^[1-9][0-9]*$ &&
              "$BASE_SHA" =~ ^[0-9a-fA-F]{40}$ &&
              "$HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ &&
              "$HEAD_REF" == feat/next ]] || {
            echo 'pull request scope identity is malformed' >&2
            exit 1
          }
          git cat-file -e "$BASE_SHA^{commit}"
          classifier="$RUNNER_TEMP/ci-change-scope.py"
          git cat-file -e "$BASE_SHA:scripts/ci_change_scope.py"
          git show "$BASE_SHA:scripts/ci_change_scope.py" > "$classifier"
          scope_root="$RUNNER_TEMP/ci-change-scope"
          mkdir -p "$scope_root"
          gh api --method GET "repos/$REPOSITORY/pulls/$PR_NUMBER" > "$scope_root/pull-request.json"
          gh api --method GET --paginate --slurp \
            "repos/$REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" > "$scope_root/files.json"
          [[ "$(jq -r '.number | tostring' "$scope_root/pull-request.json")" == "$PR_NUMBER" &&
              "$(jq -r '.state' "$scope_root/pull-request.json")" == open &&
              "$(jq -r '.base.repo.full_name' "$scope_root/pull-request.json")" == "$BASE_REPOSITORY" &&
              "$(jq -r '.base.ref' "$scope_root/pull-request.json")" == main &&
              "$(jq -r '.base.sha' "$scope_root/pull-request.json")" == "$BASE_SHA" &&
              "$(jq -r '.head.repo.full_name' "$scope_root/pull-request.json")" == "$HEAD_REPOSITORY" &&
              "$(jq -r '.head.ref' "$scope_root/pull-request.json")" == "$HEAD_REF" &&
              "$(jq -r '.head.sha' "$scope_root/pull-request.json")" == "$HEAD_SHA" ]] || {
            echo 'pull request identity moved or does not match the dispatch input' >&2
            exit 1
          }
          scope="$(python3 "$classifier" \
            --pull-request "$scope_root/pull-request.json" \
            --files "$scope_root/files.json" \
            --expected-repository "$REPOSITORY" \
            --expected-head-repository "$HEAD_REPOSITORY" \
            --expected-number "$PR_NUMBER" \
            --expected-base-sha "$BASE_SHA" \
            --expected-head-sha "$HEAD_SHA")"
          case "$scope" in
            binary-impact) binary_impact=true ;;
            no-binary-impact) binary_impact=false ;;
            *) echo 'change-scope classifier returned an invalid result' >&2; exit 1 ;;
          esac
          printf 'binary_impact=%s\n' "$binary_impact" >> "$GITHUB_OUTPUT"
      # The trusted preparer owns `python3 scripts/product_version.py bump --expected "$base_version"`
      # on temporary API data.  This reusable job only reads PR data and
      # never has a token that can mutate contents or checks.
      - name: Verify the exact next patch version
        if: steps.scope.outputs.binary_impact == 'true'
        id: version
        shell: bash
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_REF: ${{ inputs.head_ref }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$HEAD_SHA" ]] || {
            echo 'version policy checkout does not match the PR head SHA' >&2
            exit 1
          }
          base="$RUNNER_TEMP/base-version"
          mkdir -p "$base/windows-client"
          git show "$BASE_SHA:Cargo.toml" > "$base/Cargo.toml"
          git show "$BASE_SHA:Cargo.lock" > "$base/Cargo.lock"
          git show "$BASE_SHA:windows-client/Directory.Build.props" > "$base/windows-client/Directory.Build.props"
          base_version="$(python3 scripts/product_version.py check --cargo-toml "$base/Cargo.toml" --cargo-lock "$base/Cargo.lock" --windows-props "$base/windows-client/Directory.Build.props" | sed -n 's/^version=//p')"
          current_version="$(python3 scripts/product_version.py check | sed -n 's/^version=//p')"
          next_version="$(python3 scripts/product_version.py next --version "$base_version" | sed -n 's/^version=//p')"
          if [[ "$current_version" == "$next_version" ]]; then
            printf 'ready=true\nversion=%s\n' "$current_version" >> "$GITHUB_OUTPUT"
          elif [[ "$current_version" == "$base_version" ]]; then
            echo "trusted version preparation has not committed $next_version to this head" >&2
            exit 1
          else
            echo "PR version must be base $base_version or exact next patch $next_version; found $current_version" >&2
            exit 1
          fi

  native-quality:
    if: inputs.premerge == true && needs.version-prepared.outputs.binary_impact == 'true' && needs.version-prepared.outputs.ready == 'true'
    needs: [version-prepared]
    uses: ./.github/workflows/rust.yml
    with:
      source_sha: ${{ inputs.head_sha }}
    permissions:
      contents: read

  codeql-analysis:
    if: inputs.premerge == true && needs.version-prepared.outputs.binary_impact == 'true' && needs.version-prepared.outputs.ready == 'true'
    needs: [version-prepared]
    uses: ./.github/workflows/codeql.yml
    with:
      source_sha: ${{ inputs.head_sha }}
      head_ref: ${{ inputs.head_ref }}
    permissions:
      contents: read
      security-events: write

  windows-quality:
    name: Merge policy
    if: inputs.premerge == true && needs.version-prepared.outputs.binary_impact == 'true' && needs.version-prepared.outputs.ready == 'true'
    needs: [version-prepared]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.head_sha }}
          persist-credentials: false
      - name: Audit live applied merge rules
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --method GET -H "X-GitHub-Api-Version: 2026-03-10" "repos/$REPOSITORY/rules/branches/main" |
            env -u GH_TOKEN python3 scripts/workflow_quality_gate.py --validate-live-applied-rules
      - name: Write Windows quality evidence
        env:
          SOURCE_SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/windows-quality
          source_sha="$(git rev-parse HEAD)"
          tree_sha="$(git rev-parse 'HEAD^{tree}')"
          [[ "$source_sha" == "$SOURCE_SHA" ]] || {
            echo "Windows quality checkout SHA does not match the immutable source SHA" >&2
            exit 1
          }
          cat > artifacts/windows-quality/windows-quality.txt <<EOF
          schema: codex-info-quality-v1
          quality: merge-policy
          source-sha: $source_sha
          tree-sha: $tree_sha
          live-applied-rules: PASS
          merge-policy: PASS
          EOF
          (
            cd artifacts/windows-quality
            manifest="$(mktemp)"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$manifest"
            mv "$manifest" SHA256SUMS
          )
      - name: Upload Windows quality evidence
        uses: actions/upload-artifact@v4
        with:
          name: windows-quality
          path: artifacts/windows-quality
          if-no-files-found: error

  ui-quality:
    if: inputs.premerge == true && needs.version-prepared.outputs.binary_impact == 'true' && needs.version-prepared.outputs.ready == 'true'
    needs: [version-prepared]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.head_sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Install locked Inno Setup compiler
        shell: pwsh
        run: |
          winget source update --name winget --disable-interactivity
          $sourceUpdateExitCode = $LASTEXITCODE
          if ($sourceUpdateExitCode -ne 0) {
            throw ('WinGet source update failed with exit code 0x{0:X8}.' -f $sourceUpdateExitCode)
          }
          winget install --id JRSoftware.InnoSetup.7 --version 7.1.0 -e -s winget --scope user --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
          $installExitCode = $LASTEXITCODE
          if ($installExitCode -ne 0) {
            throw ('WinGet Inno Setup install failed with exit code 0x{0:X8}.' -f $installExitCode)
          }
          $compiler = Join-Path $env:LOCALAPPDATA 'Programs\Inno Setup 7\ISCC.exe'
          if (-not (Test-Path $compiler -PathType Leaf)) { throw 'Inno Setup 7.1.0 compiler was not installed.' }
          "INNO_SETUP_COMPILER=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build standard Windows setup wizard
        shell: pwsh
        run: ./windows-client/tools/Build-WindowsInstaller.ps1 -OutputDirectory artifacts/windows-installer
      - name: Verify installer artifact
        shell: pwsh
        run: |
          if (-not (Test-Path ./artifacts/windows-installer/CodexInfo.WindowsClient.Setup.exe -PathType Leaf)) {
            throw 'CodexInfo.WindowsClient.Setup.exe was not produced.'
          }
      - name: Smoke-test install and uninstall lifecycle
        shell: pwsh
        run: |
          $setup = (Resolve-Path ./artifacts/windows-installer/CodexInfo.WindowsClient.Setup.exe).Path
          $installProcess = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/MERGETASKS=desktopicon') -Wait -PassThru
          if ($installProcess.ExitCode -ne 0) { throw "Installer failed with exit code $($installProcess.ExitCode)" }
          $install = Join-Path $env:LOCALAPPDATA 'Programs\Codex Info Monitor'
          $start = Join-Path ([Environment]::GetFolderPath('Programs')) 'Codex Info\Codex Info Monitor.lnk'
          $desktop = Join-Path ([Environment]::GetFolderPath('Desktop')) 'Codex Info Monitor.lnk'
          $exe = Join-Path $install 'CodexInfo.WindowsClient.exe'
          $nativeNotice = Join-Path $install 'THIRD-PARTY-LICENSES\skiasharp.nativeassets.win32-3.119.4-THIRD-PARTY-NOTICES.txt'
          $uninstaller = Get-ChildItem -LiteralPath $install -Filter 'unins*.exe' -File | Select-Object -First 1
          if (-not (Test-Path $exe -PathType Leaf)) { throw 'Installed client executable is missing.' }
          if (-not (Test-Path $nativeNotice -PathType Leaf)) { throw 'Required SkiaSharp native notice is missing from the installed payload.' }
          if ($null -eq $uninstaller) { throw 'Installed uninstaller is missing.' }
          if (-not (Test-Path $start -PathType Leaf)) { throw 'Start-menu shortcut is missing.' }
          if (-not (Test-Path $desktop -PathType Leaf)) { throw 'Desktop shortcut is missing.' }
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\CodexInfo.WindowsClient_is1'
          if (-not (Test-Path $key)) { throw 'Per-user Apps uninstall registration is missing.' }
          if ((Get-ItemPropertyValue $key DisplayIcon) -ne $exe) { throw 'Apps entry icon does not target the product executable.' }
          $shell = New-Object -ComObject WScript.Shell
          $shortcut = $shell.CreateShortcut($start)
          if ($shortcut.TargetPath -ne $exe) { throw 'Start-menu shortcut target is incorrect.' }
          if ($shortcut.WorkingDirectory -ne $install) { throw 'Start-menu shortcut working directory is incorrect.' }
          $settings = Join-Path $env:LOCALAPPDATA 'CodexInfo'
          $sentinel = Join-Path $settings 'installer-preserve-sentinel.txt'
          New-Item -ItemType Directory -Path $settings -Force | Out-Null
          Set-Content -LiteralPath $sentinel -Value 'preserve'
          $updateProcess = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          if ($updateProcess.ExitCode -ne 0) { throw "Installer update failed with exit code $($updateProcess.ExitCode)" }
          if (-not (Test-Path $sentinel -PathType Leaf)) { throw 'Update removed user settings.' }
          Start-Process -FilePath $start
          Start-Sleep -Seconds 5
          $clientProcesses = Get-Process -Name 'CodexInfo.WindowsClient' -ErrorAction SilentlyContinue |
            Where-Object { $_.Path -eq $exe }
          if (-not $clientProcesses) { throw 'Start-menu shortcut did not launch the installed client.' }
          $clientProcesses | Stop-Process -Force
          $uninstallProcess = Start-Process -FilePath $uninstaller.FullName -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          if ($uninstallProcess.ExitCode -ne 0) { throw "Uninstaller failed with exit code $($uninstallProcess.ExitCode)" }
          Start-Sleep -Seconds 4
          if (Test-Path $install) { throw 'Install directory still exists after uninstall.' }
          if (Test-Path $start) { throw 'Start-menu shortcut still exists after uninstall.' }
          if (Test-Path $desktop) { throw 'Desktop shortcut still exists after uninstall.' }
          if (Test-Path $key) { throw 'Per-user uninstall registration still exists.' }
          if (-not (Test-Path $sentinel -PathType Leaf)) { throw 'Uninstall removed user settings.' }
          Remove-Item -LiteralPath $sentinel -Force
      - name: Run installed Windows UI Automation E2E
        shell: pwsh
        env:
          SOURCE_SHA: ${{ inputs.head_sha }}
        run: |
          $setup = (Resolve-Path ./artifacts/windows-installer/CodexInfo.WindowsClient.Setup.exe).Path
          $installProcess = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          if ($installProcess.ExitCode -ne 0) { throw "E2E fixture install failed with exit code $($installProcess.ExitCode)" }
          $install = Join-Path $env:LOCALAPPDATA 'Programs\Codex Info Monitor'
          $exe = Join-Path $install 'CodexInfo.WindowsClient.exe'
          if (-not (Test-Path $exe -PathType Leaf)) { throw 'Installed client executable is missing for UI E2E.' }
          $e2eOutput = Join-Path $env:RUNNER_TEMP 'codex-info-windows-e2e'
          try {
            New-Item -ItemType Directory -Path $e2eOutput -Force | Out-Null
            $moveSmokeLog = Join-Path $e2eOutput 'window-move-smoke.log'
            & ./windows-client/tools/Run-WindowsClientE2E.ps1 -ClientPath $exe -OutputDirectory $e2eOutput -Fixture -SourceSha $env:SOURCE_SHA
            if (-not $?) { throw 'Windows UI Automation E2E failed.' }
            "source-sha: $env:SOURCE_SHA" | Set-Content -LiteralPath $moveSmokeLog -Encoding utf8
            $moveSmokeOutput = @(& ./scripts/windows_window_move_smoke.ps1 -ClientPath $exe -AllowPhysicalInput *>&1)
            $moveSmokeOutput | Tee-Object -FilePath $moveSmokeLog -Append
            if ($moveSmokeOutput.Count -eq 0 -or [string]$moveSmokeOutput[-1] -ne 'window-move-smoke: PASS') {
              throw 'Physical window move smoke did not report its terminal PASS contract.'
            }
          }
          finally {
            $uninstaller = Get-ChildItem -LiteralPath $install -Filter 'unins*.exe' -File -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($null -ne $uninstaller) {
              $uninstallProcess = Start-Process -FilePath $uninstaller.FullName -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
              if ($uninstallProcess.ExitCode -ne 0) { throw "E2E cleanup uninstall failed with exit code $($uninstallProcess.ExitCode)" }
            }
          }
      - name: Write UI quality evidence
        if: success()
        shell: pwsh
        env:
          SOURCE_SHA: ${{ inputs.head_sha }}
        run: |
          $sourceSha = (& git rev-parse HEAD).Trim()
          $treeSha = (& git rev-parse 'HEAD^{tree}').Trim()
          if ($sourceSha -ne $env:SOURCE_SHA) { throw 'UI quality checkout SHA does not match the immutable source SHA.' }
          $evidence = Join-Path $env:RUNNER_TEMP 'codex-info-windows-e2e'
          if (-not (Test-Path -LiteralPath $evidence -PathType Container)) { throw 'Windows UI evidence directory is missing.' }
          $encoding = [System.Text.UTF8Encoding]::new($false)
          $qualityLines = @(
            'schema: codex-info-quality-v1'
            'quality: ui'
            "source-sha: $sourceSha"
            "tree-sha: $treeSha"
            'windows-ui-e2e: PASS'
            'window-move-smoke: PASS'
            'ui-quality: PASS'
          )
          $qualityPath = Join-Path $evidence 'ui-quality.txt'
          [System.IO.File]::WriteAllText(
            $qualityPath,
            (($qualityLines -join "`n") + "`n"),
            $encoding
          )
          $hashLines = @(
            Get-ChildItem -LiteralPath $evidence -File |
              Where-Object { $_.Name -ne 'SHA256SUMS' } |
              Sort-Object FullName |
              ForEach-Object {
                $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
                $relative = $_.FullName.Substring($evidence.Length).TrimStart([char[]]@('\', '/')) -replace '\\', '/'
                "$hash  $relative"
              }
          )
          $manifestPath = Join-Path $evidence 'SHA256SUMS'
          [System.IO.File]::WriteAllText(
            $manifestPath,
            (($hashLines -join "`n") + "`n"),
            $encoding
          )
      - name: Upload Windows UI E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-ui-e2e
          path: ${{ runner.temp }}/codex-info-windows-e2e
          if-no-files-found: warn
      - name: Upload CI installer artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-client-installer
          path: artifacts/windows-installer/CodexInfo.WindowsClient.Setup.exe
          if-no-files-found: warn

  acceptance:
    # This job produces evidence only. The trusted caller publishes the two
    # exact required check-runs on the immutable PR head.
    if: always() && inputs.premerge == true
    needs: [version-prepared, native-quality, codeql-analysis, windows-quality, ui-quality]
    runs-on: ubuntu-latest
    outputs:
      verdict_artifact_id: ${{ steps.verdict-artifact.outputs.artifact-id }}
      verdict_artifact_digest: ${{ steps.verdict-artifact.outputs.artifact-digest }}
      candidate_artifact_id: ${{ steps.candidate-artifact.outputs.artifact-id }}
      candidate_artifact_digest: ${{ steps.candidate-artifact.outputs.artifact-digest }}
    steps:
      - name: Verify quality job outcomes
        env:
          NATIVE_RESULT: ${{ needs.native-quality.result }}
          CODEQL_RESULT: ${{ needs.codeql-analysis.result }}
          WINDOWS_RESULT: ${{ needs.windows-quality.result }}
          UI_RESULT: ${{ needs.ui-quality.result }}
          VERSION_RESULT: ${{ needs.version-prepared.result }}
          BINARY_IMPACT: ${{ needs.version-prepared.outputs.binary_impact }}
          VERSION_READY: ${{ needs.version-prepared.outputs.ready }}
        run: |
          set -euo pipefail
          [[ "$VERSION_RESULT" == success ]] || { echo "version-prepared job did not succeed: $VERSION_RESULT" >&2; exit 1; }
          case "$BINARY_IMPACT" in
            true)
              [[ "$VERSION_READY" == true ]] || { echo 'version preparation did not complete on this revision' >&2; exit 1; }
              for result in "$NATIVE_RESULT" "$CODEQL_RESULT" "$WINDOWS_RESULT" "$UI_RESULT"; do
                [[ "$result" == success ]] || {
                  echo "quality job did not succeed: $result" >&2
                  exit 1
                }
              done
              ;;
            false)
              [[ -z "$VERSION_READY" ]] || { echo 'non-binary-impact change unexpectedly prepared a version' >&2; exit 1; }
              for result in "$NATIVE_RESULT" "$CODEQL_RESULT" "$WINDOWS_RESULT" "$UI_RESULT"; do
                [[ "$result" == skipped ]] || {
                  echo "non-binary-impact quality job was not skipped: $result" >&2
                  exit 1
                }
              done
              ;;
            *)
              echo 'pull request change scope is missing or malformed' >&2
              exit 1
              ;;
          esac
      - uses: actions/checkout@v4
        if: needs.version-prepared.outputs.binary_impact == 'true'
        with:
          fetch-depth: 0
          ref: ${{ inputs.head_sha }}
          persist-credentials: false
      - name: Download native quality evidence
        if: needs.version-prepared.outputs.binary_impact == 'true'
        uses: actions/download-artifact@v4
        with:
          name: native-quality
          path: artifacts/native-quality
      - name: Download Windows quality evidence
        if: needs.version-prepared.outputs.binary_impact == 'true'
        uses: actions/download-artifact@v4
        with:
          name: windows-quality
          path: artifacts/windows-quality
      - name: Download Windows UI E2E evidence
        if: needs.version-prepared.outputs.binary_impact == 'true'
        uses: actions/download-artifact@v4
        with:
          name: windows-ui-e2e
          path: artifacts/windows-ui-e2e
      - name: Download CI installer artifact
        if: needs.version-prepared.outputs.binary_impact == 'true'
        uses: actions/download-artifact@v4
        with:
          name: windows-client-installer
          path: artifacts/windows-installer
      - name: Run final acceptance gate before merge
        if: needs.version-prepared.outputs.binary_impact == 'true'
        env:
          EXPECTED_E2E_SOURCE_SHA: ${{ inputs.head_sha }}
        run: bash scripts/final_acceptance_gate.sh artifacts/windows-ui-e2e artifacts/native-quality artifacts/windows-quality
      - name: Assemble accepted release candidate
        if: needs.version-prepared.outputs.binary_impact == 'true'
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          VERSION: ${{ needs.version-prepared.outputs.version }}
        run: |
          set -euo pipefail
          candidate=artifacts/release-candidate
          rm -rf "$candidate"
          mkdir -p "$candidate"
          cp artifacts/windows-installer/CodexInfo.WindowsClient.Setup.exe "$candidate/"
          cp -R artifacts/native-quality "$candidate/"
          cp -R artifacts/windows-quality "$candidate/"
          cp -R artifacts/windows-ui-e2e "$candidate/"
          source_sha="$(git rev-parse HEAD)"
          tree_sha="$(git rev-parse 'HEAD^{tree}')"
          cat > "$candidate/acceptance.txt" <<EOF
          schema: codex-info-quality-v1
          pr-number: $PR_NUMBER
          source-sha: $source_sha
          tree-sha: $tree_sha
          version: $VERSION
          acceptance: PASS
          EOF
          (
            cd "$candidate"
            manifest="$(mktemp)"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$manifest"
            mv "$manifest" SHA256SUMS
          )
      - name: Upload accepted release candidate
        id: candidate-artifact
        if: needs.version-prepared.outputs.binary_impact == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: artifacts/release-candidate
          if-no-files-found: error
      - name: Write final-head acceptance verdict
        env:
          BINARY_IMPACT: ${{ needs.version-prepared.outputs.binary_impact }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
          VERSION: ${{ needs.version-prepared.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/acceptance-verdict
          cat > artifacts/acceptance-verdict/acceptance.txt <<EOF
          schema: codex-info-final-head-v1
          pr-number: $PR_NUMBER
          source-sha: $HEAD_SHA
          binary-impact: $BINARY_IMPACT
          version: $VERSION
          acceptance: PASS
          EOF
          (
            cd artifacts/acceptance-verdict
            sha256sum acceptance.txt > SHA256SUMS
          )
      - name: Upload final-head acceptance verdict
        id: verdict-artifact
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-verdict
          path: artifacts/acceptance-verdict
          if-no-files-found: error

  release:
    # The push job is deliberately packaging-only.  All quality evidence is
    # imported from the one accepted PR run below; no test or acceptance gate
    # is rerun after merge.
    if: github.event_name == 'pull_request_target' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      checks: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/heads/main
      - name: Classify merged pull request scope
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ &&
              "$BASE_REPOSITORY" == "$REPOSITORY" &&
              "$HEAD_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ &&
              "$PR_NUMBER" =~ ^[1-9][0-9]*$ &&
              "$BASE_SHA" =~ ^[0-9a-fA-F]{40}$ &&
              "$HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo 'merged pull request scope identity is malformed' >&2
            exit 1
          }
          scope_root="$RUNNER_TEMP/ci-change-scope"
          mkdir -p "$scope_root"
          gh api --method GET "repos/$REPOSITORY/pulls/$PR_NUMBER" > "$scope_root/pull-request.json"
          gh api --method GET --paginate --slurp \
            "repos/$REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" > "$scope_root/files.json"
          scope="$(python3 scripts/ci_change_scope.py \
            --pull-request "$scope_root/pull-request.json" \
            --files "$scope_root/files.json" \
            --expected-repository "$REPOSITORY" \
            --expected-head-repository "$HEAD_REPOSITORY" \
            --expected-number "$PR_NUMBER" \
            --expected-base-sha "$BASE_SHA" \
            --expected-head-sha "$HEAD_SHA")"
          case "$scope" in
            binary-impact) binary_impact=true ;;
            no-binary-impact) binary_impact=false ;;
            *) echo 'change-scope classifier returned an invalid result' >&2; exit 1 ;;
          esac
          printf 'binary_impact=%s\n' "$binary_impact" >> "$GITHUB_OUTPUT"
      - name: Resolve accepted PR quality run
        if: steps.scope.outputs.binary_impact == 'true'
        id: quality-run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          pull_request_json="$RUNNER_TEMP/release-quality-pull-request.json"
          check_runs_json="$RUNNER_TEMP/release-quality-check-runs.json"
          workflow_run_json="$RUNNER_TEMP/release-quality-workflow-run.json"
          gh api --method GET \
            "repos/$REPOSITORY/pulls/$PR_NUMBER" > "$pull_request_json"
          gh api --method GET --paginate --slurp \
            "repos/$REPOSITORY/commits/$PR_HEAD_SHA/check-runs?check_name=acceptance&filter=all&per_page=100" \
            > "$check_runs_json"
          resolved_run_id="$(
            python3 scripts/release_quality_run_resolver.py \
              --event "$GITHUB_EVENT_PATH" \
              --pull-request "$pull_request_json" \
              --check-runs "$check_runs_json"
          )"
          gh api --method GET \
            "repos/$REPOSITORY/actions/runs/$resolved_run_id" > "$workflow_run_json"
          verified_run_id="$(
            python3 scripts/release_quality_run_resolver.py \
              --event "$GITHUB_EVENT_PATH" \
              --pull-request "$pull_request_json" \
              --check-runs "$check_runs_json" \
              --workflow-run "$workflow_run_json"
          )"
          [[ "$verified_run_id" == "$resolved_run_id" ]] || {
            echo 'accepted run changed during verification' >&2
            exit 1
          }
          printf 'run-id=%s\n' "$resolved_run_id" >> "$GITHUB_OUTPUT"
      - name: Download accepted PR release candidate
        if: steps.scope.outputs.binary_impact == 'true'
        uses: actions/download-artifact@v4
        with:
          name: release-candidate
          run-id: ${{ steps.quality-run.outputs.run-id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: artifacts/release-candidate
      - name: Verify accepted source and artifact hashes
        if: steps.scope.outputs.binary_impact == 'true'
        env:
          EXPECTED_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          EXPECTED_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo 'release pull request number is malformed' >&2
            exit 1
          }
          [[ "$(grep -Fxc "pr-number: $EXPECTED_PR_NUMBER" artifacts/release-candidate/acceptance.txt || true)" == 1 ]] || {
            echo 'accepted candidate pull request number does not match the merged pull request' >&2
            exit 1
          }
          bash scripts/release_candidate_gate.sh artifacts/release-candidate "$EXPECTED_MERGE_SHA"
      - name: Create deterministic update manifest
        if: steps.scope.outputs.binary_impact == 'true'
        id: release-version
        shell: pwsh
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          $version = (python3 scripts/product_version.py check | Select-String '^version=').Line.Substring(8)
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          ./windows-client/tools/New-WindowsUpdateManifest.ps1 `
            -Version $version `
            -InstallerPath ./artifacts/release-candidate/CodexInfo.WindowsClient.Setup.exe `
            -OutputPath ./artifacts/release-candidate/CodexInfo.WindowsClient.update.json `
            -Repository $env:REPOSITORY
      - name: Create GitHub Release and upload Windows assets
        if: steps.scope.outputs.binary_impact == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release-version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "windows-v$env:VERSION"
          $repository = $env:REPOSITORY
          $setup = './artifacts/release-candidate/CodexInfo.WindowsClient.Setup.exe'
          $manifest = './artifacts/release-candidate/CodexInfo.WindowsClient.update.json'

          function Get-GitHubResourceStatus {
            param([Parameter(Mandatory = $true)][string]$Endpoint)

            # GitHub CLI writes its 404 explanation to stderr. Temporarily
            # collect that native stream instead of letting the enclosing
            # ErrorActionPreference=Stop obscure the HTTP status line.
            $previousErrorActionPreference = $ErrorActionPreference
            try {
              $ErrorActionPreference = 'Continue'
              $response = @(& gh api --include --silent `
                -H 'Accept: application/vnd.github+json' `
                -H 'X-GitHub-Api-Version: 2022-11-28' `
                $Endpoint 2>&1)
              $exitCode = $LASTEXITCODE
            }
            finally {
              $ErrorActionPreference = $previousErrorActionPreference
            }
            $statusCodes = @()
            foreach ($line in $response) {
              if ([string]$line -match '^HTTP/(?:1\.1|2(?:\.0)?)\s+([0-9]{3})(?:\s|$)') {
                $statusCodes += [int]$Matches[1]
              }
            }
            if ($statusCodes.Count -ne 1) {
              throw "GitHub did not return one unambiguous HTTP status for $Endpoint."
            }

            $statusCode = $statusCodes[0]
            if ($statusCode -ge 200 -and $statusCode -le 299 -and $exitCode -eq 0) {
              return $statusCode
            }
            if ($statusCode -eq 404 -and $exitCode -ne 0) {
              return $statusCode
            }
            throw "GitHub resource check failed closed for $Endpoint (HTTP $statusCode, exit $exitCode)."
          }

          $releaseEndpoint = "repos/$repository/releases/tags/$tag"
          $tagEndpoint = "repos/$repository/git/ref/tags/$tag"
          if ((Get-GitHubResourceStatus $releaseEndpoint) -ne 404) {
            throw "GitHub Release already exists: $tag"
          }
          if ((Get-GitHubResourceStatus $tagEndpoint) -ne 404) {
            throw "Git tag already exists: $tag"
          }

          # Creating the ref is the atomic no-clobber boundary. A concurrent or
          # pre-existing tag makes this request fail; the workflow never falls
          # back to attaching a Release to somebody else's ref.
          gh api --method POST "repos/$repository/git/refs" `
            -f "ref=refs/tags/$tag" `
            -f "sha=$env:EXPECTED_MERGE_SHA" *> $null
          if ($LASTEXITCODE -ne 0) { throw "Atomic Git tag creation failed for $tag" }

          # Keep the Release invisible until both exact assets have uploaded
          # and their server-side names, byte sizes, and state are verified.
          $createdReleaseJson = & gh api --method POST "repos/$repository/releases" `
            -H 'Accept: application/vnd.github+json' `
            -H 'X-GitHub-Api-Version: 2022-11-28' `
            -f "tag_name=$tag" `
            -f "name=Codex Info Monitor $env:VERSION" `
            -f "body=Windows client $env:VERSION" `
            -F draft=true `
            -F prerelease=false
          if ($LASTEXITCODE -ne 0) { throw "Draft GitHub Release creation failed for $tag" }
          $createdReleaseJson | python3 scripts/release_state_gate.py created --tag $tag
          if ($LASTEXITCODE -ne 0) {
            throw "Created draft GitHub Release state is invalid for $tag"
          }
          $createdRelease = $createdReleaseJson | ConvertFrom-Json
          $createdReleaseId = [long]$createdRelease.id
          $draftReleaseEndpoint = "repos/$repository/releases/$createdReleaseId"

          gh release upload $tag $setup $manifest --repo $repository
          if ($LASTEXITCODE -ne 0) { throw "Draft GitHub Release asset upload failed for $tag" }

          $releaseJson = & gh api `
            -H 'Accept: application/vnd.github+json' `
            -H 'X-GitHub-Api-Version: 2022-11-28' `
            $draftReleaseEndpoint
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect the draft GitHub Release for $tag" }
          $releaseJson | python3 scripts/release_state_gate.py draft `
            --tag $tag --setup $setup --manifest $manifest
          if ($LASTEXITCODE -ne 0) {
            throw "Draft GitHub Release state is invalid for $tag"
          }

          $tagJson = & gh api `
            -H 'Accept: application/vnd.github+json' `
            -H 'X-GitHub-Api-Version: 2022-11-28' `
            $tagEndpoint
          if ($LASTEXITCODE -ne 0) { throw "Could not verify the created Git tag for $tag" }
          $tagJson | python3 scripts/release_state_gate.py tag --sha $env:EXPECTED_MERGE_SHA
          if ($LASTEXITCODE -ne 0) {
            throw "Created Git tag does not identify the gated commit for $tag"
          }

          gh api --method PATCH "repos/$repository/releases/$createdReleaseId" `
            -F draft=false *> $null
          if ($LASTEXITCODE -ne 0) { throw "Publishing the verified GitHub Release failed for $tag" }

          $publishedJson = & gh api `
            -H 'Accept: application/vnd.github+json' `
            -H 'X-GitHub-Api-Version: 2022-11-28' `
            $releaseEndpoint
          if ($LASTEXITCODE -ne 0) { throw "Could not verify the published GitHub Release for $tag" }
          $publishedJson | python3 scripts/release_state_gate.py published `
            --tag $tag --setup $setup --manifest $manifest
          if ($LASTEXITCODE -ne 0) {
            throw "Published GitHub Release verification failed for $tag"
          }
