[graph]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true

[advisories]
unmaintained = "all"
unsound = "all"
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste is an unmaintained transitive Slint image dependency; RustSec reports no vulnerability and no safe upgrade" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz is an unmaintained transitive Slint SVG dependency; RustSec reports no vulnerability and no safe upgrade" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is an unmaintained transitive Slint SVG dependency; RustSec reports no vulnerability and no safe upgrade" },
]

[licenses]
confidence-threshold = 0.8
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "GPL-3.0-only",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[licenses.private]
ignore = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
